<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"link","type":"string","label":"The San Francisco map address, no scheme","default":"example.com/tinysfo/"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tiny Worlds · From the sky to the sidewalk</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: Archivo;
        src: url("assets/fonts/archivo.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: Tiny5;
        src: url("assets/fonts/tiny5-latin.woff2") format("woff2");
      }
      :root {
        --enamel: #15171a;
        --paper: #f4f2ec;
        --fog: #e9e6df;
        --accent: #f07858;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
      }
      #social-sky {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--fog);
        font-family: Archivo, sans-serif;
      }
      .take {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
      }
      .graphics {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      #drop-iris {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #link {
        position: absolute;
        left: 0;
        right: 0;
        top: 668px;
        z-index: 3;
        margin: 0;
        text-align: center;
        color: var(--accent);
        font-size: 46px;
        font-weight: 640;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <main
      id="social-sky"
      data-composition-id="social-sky"
      data-start="0"
      data-duration="26.4"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="map-take"
        class="clip take"
        data-start="0"
        data-duration="9.833"
        data-track-index="0"
        src="assets/takes/sky-map.mp4"
        muted
        playsinline
      ></video>
      <video
        id="drive-take"
        class="clip take"
        data-start="9.833"
        data-duration="6.002"
        data-track-index="0"
        src="assets/takes/sky-drive.mp4"
        muted
        playsinline
      ></video>
      <div
        id="drop-iris"
        class="clip"
        data-composition-id="drop-iris"
        data-composition-src="compositions/drop-iris.html"
        data-start="9.833"
        data-duration="0.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <video
        id="span-take"
        class="clip take"
        data-start="15.835"
        data-duration="10.565"
        data-media-start="8.834"
        data-track-index="0"
        src="assets/takes/sky-drive.mp4"
        muted
        playsinline
      ></video>

      <div
        id="lines"
        class="clip graphics"
        data-composition-id="lines"
        data-composition-src="compositions/lines.html"
        data-start="0"
        data-duration="16.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="end-card"
        class="clip graphics"
        data-composition-id="end-card"
        data-composition-src="compositions/end-card.html"
        data-start="21.835"
        data-duration="4.565"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <p
        id="link"
        class="clip"
        data-start="22.435"
        data-duration="3.965"
        data-track-index="3"
        data-track-kind="graphics"
        data-var-text="link"
      >
        example.com/tinysfo/
      </p>

      <audio
        id="bed"
        class="clip"
        data-start="0"
        data-duration="26.4"
        data-media-start="1.0"
        data-track-index="4"
        data-volume="0.9"
        data-fade-in="0.02"
        data-fade-out="1.6"
        src="assets/music/bed.mp3"
      ></audio>
      <audio
        id="pick-up"
        class="clip"
        data-start="7.4"
        data-duration="0.5"
        data-track-index="5"
        data-volume="0.4"
        data-fade-out="0.1"
        src="assets/sfx/pop.mp3"
      ></audio>
      <audio
        id="drop-whoosh"
        class="clip"
        data-start="9.7"
        data-duration="0.57"
        data-track-index="5"
        data-volume="0.55"
        src="assets/sfx/whoosh.mp3"
      ></audio>
      <audio
        id="tower-pass"
        class="clip"
        data-start="15.76"
        data-duration="0.57"
        data-track-index="6"
        data-volume="0.4"
        src="assets/sfx/whoosh-short.mp3"
      ></audio>
      <audio
        id="end-pop"
        class="clip"
        data-start="21.835"
        data-duration="0.6"
        data-track-index="5"
        data-volume="0.35"
        data-fade-out="0.15"
        src="assets/sfx/pop.mp3"
      ></audio>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#link", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 22.435);
      window.__timelines["social-sky"] = tl;
    </script>
  </body>
</html>
