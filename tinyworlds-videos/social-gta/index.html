<!doctype html>
<!--
  A tour of the five GTA-inspired worlds, 1920 × 1080, 37 s, for the series' fans. A stop per
  world in the order the games came out (6 s each: the whole city with its districts named by
  the viewer's own region lines, then the viewer's flight down to its best-known landmark),
  a few seconds at the wheel in Street Walk, and the end card. Every map is the live site, filmed
  by scripts/social/gta.ts; what is added is a name per world and per landmark, the end card
  and an original score that imitates no one's.

  Fan-made, and the end card says so. The site's address is never written here (the repository
  is public): it is the `address` variable, given at render time.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"address","type":"string","label":"Where the maps live, on the end card","default":"example.com"},
    {"id":"tagline","type":"string","label":"The line beside the wordmark","default":"Five made-up cities, pocket-sized"},
    {"id":"note","type":"string","label":"The small print, first line","default":"Fan-made maps inspired by the Grand Theft Auto series."},
    {"id":"note2","type":"string","label":"The small print, second line","default":"Not affiliated with Rockstar Games or Take-Two Interactive."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Tiny5";
        src: url("assets/fonts/tiny5-latin.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e9e6df;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Archivo", sans-serif;
      }
      #drive {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: contain;
      }
      .sign {
        overflow: hidden;
        background: #15171a;
        color: #f4f2ec;
        border-radius: 20px;
        box-shadow:
          inset 0 2px 0 rgb(255 255 255 / 0.08),
          0 0 0 2px rgb(0 0 0 / 0.6),
          0 32px 68px -28px rgb(0 0 0 / 0.65),
          0 4px 12px -2px rgb(0 0 0 / 0.3);
        white-space: nowrap;
      }
      #drive-sign {
        position: absolute;
        left: 96px;
        bottom: 96px;
      }
      #drive-strip {
        height: 8px;
        background: #f7c21b;
      }
      #drive-line {
        padding: 20px 46px 28px;
        font-size: 68px;
        line-height: 1.08;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      /* the end card: the five worlds' wordmarks, then one sign with the site's */
      #end {
        position: absolute;
        inset: 0;
        background: #e9e6df;
        z-index: 5;
      }
      #end-roll {
        position: absolute;
        left: 0;
        top: 330px;
        width: 1920px;
        display: flex;
        justify-content: center;
        gap: 24px;
      }
      .end-pill {
        background: #15171a;
        border-radius: 14px;
        padding: 16px 24px 18px;
        font-family: "Tiny5", monospace;
        font-size: 52px;
        line-height: 1;
        color: #f4f2ec;
        white-space: nowrap;
        border-top: 6px solid var(--accent);
      }
      .end-pill b {
        font-weight: 400;
        color: var(--accent);
      }
      #end-card {
        position: absolute;
        left: 0;
        top: 540px;
        width: 1920px;
        display: flex;
        justify-content: center;
      }
      #end-sign {
        position: relative;
        display: flex;
        align-items: center;
        gap: 48px;
        padding: 34px 54px 32px;
      }
      #end-strip {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 6px;
        background: #f7c21b;
      }
      #end-wordmark {
        font-family: "Tiny5", monospace;
        font-size: 64px;
        line-height: 1;
      }
      #end-wordmark b {
        font-weight: 400;
        color: #f7c21b;
      }
      #end-line {
        font-size: 46px;
        line-height: 1.12;
        font-weight: 600;
        letter-spacing: -0.012em;
      }
      #end-address {
        padding-top: 6px;
        font-size: 38px;
        line-height: 1.2;
        font-weight: 600;
        color: #f7c21b;
      }
      .end-note {
        padding-top: 6px;
        font-size: 28px;
        line-height: 1.25;
        font-weight: 400;
        color: #b4b1a8;
      }
      #end-note {
        padding-top: 14px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="37"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="tour"
        data-composition-id="tour"
        data-composition-src="compositions/tour.html"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- at the wheel in Street Walk, on Vice City's beach (gta.ts drive) -->
      <video
        id="drive"
        class="clip"
        data-start="30"
        data-duration="2"
        data-media-start="0.6"
        data-track-index="2"
        src="assets/takes/drive.mp4"
        muted
        playsinline
      ></video>
      <div id="drive-c" class="clip" data-start="30.05" data-duration="1.9" data-track-index="3">
        <div id="drive-sign" class="sign">
          <div id="drive-strip"></div>
          <div id="drive-line">Then take the wheel</div>
        </div>
      </div>

      <!-- the end card lives in the root: a render sets only the root's variables -->
      <div id="end" class="clip" data-start="32" data-duration="5" data-track-index="4">
        <div id="end-roll">
          <div class="end-pill" style="--accent: #abd681"><span>tiny</span><b>gtaiii</b></div>
          <div class="end-pill" style="--accent: #f59bc8"><span>tiny</span><b>vicecity</b></div>
          <div class="end-pill" style="--accent: #f4bd77"><span>tiny</span><b>sanandreas</b></div>
          <div class="end-pill" style="--accent: #9cc8ee"><span>tiny</span><b>gtaiv</b></div>
          <div class="end-pill" style="--accent: #9cdc91"><span>tiny</span><b>gtav</b></div>
        </div>
        <div id="end-card">
          <div id="end-sign" class="sign">
            <div id="end-strip"></div>
            <div id="end-wordmark">tiny<b>worlds</b></div>
            <div id="end-words">
              <div id="end-line" data-var-text="tagline">Five made-up cities, pocket-sized</div>
              <div id="end-address" data-var-text="address">example.com</div>
              <div id="end-note" class="end-note" data-var-text="note">
                Fan-made maps inspired by the Grand Theft Auto series.
              </div>
              <div id="end-note2" class="end-note" data-var-text="note2">
                Not affiliated with Rockstar Games or Take-Two Interactive.
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- the bed (gta.ts music): 120 BPM from its first beat, 0.02 s in; its last hit is at 32 s
           of the film, where the end card lands, and it rings out from there -->
      <audio
        id="bed"
        class="clip"
        src="assets/music/bed.mp3"
        data-start="0"
        data-duration="37"
        data-media-start="0.02"
        data-track-index="10"
        data-volume="0.8"
        data-fade-out="1.5"
      ></audio>
      <!-- the flights down to each landmark: a whoosh peaking mid-flight, two takes in turn -->
      <audio
        id="sfx-fly1"
        class="clip"
        src="assets/sfx/whoosh.mp3"
        data-start="2.43"
        data-duration="0.57"
        data-track-index="11"
        data-volume="0.35"
      ></audio>
      <audio
        id="sfx-fly2"
        class="clip"
        src="assets/sfx/whoosh-cinematic.mp3"
        data-start="8.15"
        data-duration="1.2"
        data-media-start="2.3"
        data-track-index="12"
        data-volume="0.3"
      ></audio>
      <audio
        id="sfx-fly3"
        class="clip"
        src="assets/sfx/whoosh.mp3"
        data-start="14.43"
        data-duration="0.57"
        data-track-index="11"
        data-volume="0.35"
      ></audio>
      <audio
        id="sfx-fly4"
        class="clip"
        src="assets/sfx/whoosh-cinematic.mp3"
        data-start="20.15"
        data-duration="1.2"
        data-media-start="2.3"
        data-track-index="12"
        data-volume="0.3"
      ></audio>
      <audio
        id="sfx-fly5"
        class="clip"
        src="assets/sfx/whoosh.mp3"
        data-start="26.43"
        data-duration="0.57"
        data-track-index="11"
        data-volume="0.35"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#drive-sign",
        { y: 42, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.2, ease: "steps(3)" },
        30.05,
      );
      tl.fromTo(
        "#drive-sign",
        { y: 0, opacity: 1 },
        { y: -28, opacity: 0, duration: 0.17, ease: "steps(3)", immediateRender: false },
        31.75,
      );
      // the end card is stamped on, the way pixels arrive: in steps
      tl.fromTo(
        ".end-pill",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.15, ease: "steps(2)", stagger: 0.08 },
        32.0,
      );
      tl.fromTo(
        "#end-sign",
        { y: 46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.2, ease: "steps(3)" },
        32.25,
      );
      tl.fromTo(
        "#end-strip",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        32.33,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
