<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #e9e6df;
      font-family: "Archivo", sans-serif;
      color: #f4f2ec;
    }
    /* the middle of Dallas's card in "Build the next city", 5.6 times the site's size */
    #stones-sign {
      position: absolute;
      left: 120px;
      top: 130px;
      width: 1680px;
      height: 560px;
      background: #15171a;
      border-radius: 40px;
      box-shadow:
        inset 0 4px 0 rgb(255 255 255 / 0.08),
        0 0 0 4px rgb(0 0 0 / 0.6),
        0 50px 110px -40px rgb(0 0 0 / 0.65),
        0 8px 20px -4px rgb(0 0 0 / 0.3);
    }
    #stones-city {
      position: absolute;
      left: 75px;
      top: 62px;
      font-size: 84px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    #stones-raised {
      position: absolute;
      right: 75px;
      top: 80px;
      font-size: 54px;
      line-height: 1;
      color: #a4a6a1;
    }
    /* the site's StoneWall: fifteen to a row, the first and the last marked */
    .stone {
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 10px;
    }
    .stone-empty {
      background: rgb(255 255 255 / 0.08);
      box-shadow: inset 0 -10px 0 rgb(0 0 0 / 0.25);
    }
    .stone-laid {
      background: #f7c21b;
      box-shadow: inset 0 -10px 0 rgb(0 0 0 / 0.25);
    }
    .stone-mark::after {
      content: "";
      position: absolute;
      inset: 30%;
      transform: rotate(45deg);
      border-radius: 4px;
      background: #1a1503;
    }
    #stones-status {
      position: absolute;
      left: 75px;
      top: 452px;
      font-size: 52px;
      line-height: 1;
      color: #a4a6a1;
      white-space: nowrap;
    }
    #stones-full {
      color: #f7c21b;
      font-weight: 600;
    }
    /* the gifts, as the front page's wall of benefactors shows each one */
    .gift {
      position: absolute;
      top: 728px;
      height: 112px;
      padding: 18px 34px 0;
      background: #15171a;
      border-radius: 24px;
      box-shadow:
        inset 0 3px 0 rgb(255 255 255 / 0.08),
        0 0 0 3px rgb(0 0 0 / 0.6),
        0 30px 60px -26px rgb(0 0 0 / 0.65);
      white-space: nowrap;
    }
    .gift-name {
      font-size: 40px;
      line-height: 1.1;
      font-weight: 600;
    }
    .gift-line {
      font-size: 32px;
      line-height: 1.3;
      color: #a4a6a1;
    }
    .gift-line b {
      color: #f7c21b;
      font-weight: 600;
    }
  </style>
  <div
    id="root"
    data-composition-id="stones"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[
      {"id":"first","type":"string","label":"First gift: name","default":"James Creedon"},
      {"id":"second","type":"string","label":"Second gift: name","default":"Anonymous"}
    ]'
  >
    <div id="stones-sign">
      <div id="stones-city">Dallas</div>
      <div id="stones-raised"><span id="stones-sum">$10</span> raised</div>
      <div id="stones-status">
        <span id="stones-count">3 of 30 stones laid</span
        ><span id="stones-full" style="opacity: 0"> · Funded in full</span>
      </div>
    </div>
    <!-- the stones: drawn by the script below from the sign's own grid (75, 200 inside the
         sign; 88 px stones, 15 px gaps), empty under, laid over -->
    <div id="stones-wall"></div>

    <div
      id="gift-1"
      class="clip gift"
      style="left: 120px"
      data-start="0"
      data-duration="7.8"
      data-track-index="2"
    >
      <div class="gift-name" data-var-text="first">James Creedon</div>
      <div class="gift-line"><b>$10</b> · Dallas</div>
    </div>
    <div
      id="gift-2"
      class="clip gift"
      style="left: 650px"
      data-start="1.35"
      data-duration="6.45"
      data-track-index="3"
    >
      <div id="gift-2-plate">
        <div class="gift-name" data-var-text="second">Anonymous</div>
        <div class="gift-line"><b>$25</b> · Dallas</div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const wall = document.querySelector('[data-composition-id="stones"] #stones-wall');
      // where the stones are: the sign at (120, 130), its wall 75 px in and 200 px down
      const X0 = 120 + 75;
      const Y0 = 130 + 200;
      const PITCH = 103;
      const at = (i) => ({ x: X0 + (i % 15) * PITCH, y: Y0 + Math.floor(i / 15) * PITCH });
      // when each stone is laid: the first gift's ten (three already down at frame 0), the
      // second gift's twenty, the last of them the keystone, on "laid"
      const LAID = [];
      for (let i = 0; i < 10; i++) LAID.push(-0.2 + i * 0.1);
      for (let k = 0; k < 19; k++) LAID.push(1.5 + k * 0.19);
      LAID.push(6.73);
      for (let i = 0; i < 30; i++) {
        const p = at(i);
        const mark = i === 0 || i === 29 ? " stone-mark" : "";
        const under = document.createElement("div");
        under.className = "stone stone-empty" + mark;
        under.style.left = p.x + "px";
        under.style.top = p.y + "px";
        wall.appendChild(under);
        const over = document.createElement("div");
        over.id = "stone-" + (i + 1);
        over.className = "stone stone-laid" + mark;
        over.style.left = p.x + "px";
        over.style.top = p.y + "px";
        wall.appendChild(over);
        const t = LAID[i];
        if (t <= 0) continue;
        // a stone drops into place in steps, as pixels do; the keystone from higher, heavier
        const keystone = i === 29;
        tl.fromTo(
          over,
          { opacity: 0, y: keystone ? -260 : -46 },
          { opacity: 1, y: 0, duration: keystone ? 0.17 : 0.13, ease: keystone ? "steps(5)" : "steps(3)" },
          t - (keystone ? 0.17 : 0.13),
        );
        tl.set("#stones-count", { textContent: i + 1 + " of 30 stones laid" }, t);
      }
      tl.set("#stones-sum", { textContent: "$35" }, 1.35);
      tl.set("#stones-full", { opacity: 1 }, 6.76);
      // the second gift's plaque steps in
      tl.fromTo(
        "#gift-2-plate",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.17, ease: "steps(3)" },
        1.35,
      );
      // the keystone's blow: the sign gives a little under it
      tl.fromTo("#stones-sign", { y: 0 }, { y: 6, duration: 0.05, ease: "steps(1)" }, 6.73);
      tl.to("#stones-sign", { y: 0, duration: 0.1, ease: "steps(2)" }, 6.8);
      window.__timelines["stones"] = tl;
    })();
  </script>
</template>
