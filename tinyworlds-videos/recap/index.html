<!doctype html>
<!--
  "Thirty stones": the recap film, 1920 × 1080, 57.6 s. What tinyworlds has done so far and the
  invitation to lay the next stone. Dallas's foundation fills in its two real gifts, the keystone
  opens onto the real Dallas viewer (one continuous take: npm run recap -- take), then the history
  of the map, every real city in the order it went up (cut from its tiles: npm run recap --
  plates), the live front page's thirteen cities, the Hall of Fame and London's empty
  foundation, captured from the site (npm run recap -- pages). Narrated (assets/voice,
  npm run recap -- voice) with subtitles in the site's pixel letters. See SPEC.md.

  The site's address is never written here (the repository is public): it is the `address`
  variable, given at render time by npm run recap -- render.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"address","type":"string","label":"Site address on the end card","default":"example.com"},
    {"id":"cta","type":"string","label":"Question on the end card","default":"Which city should we build next?"}
  ]'
>

      }
      @font-face {

        padding: 0;

      }
      html,

        background: #e9e6df;

        height: 1080px;
        overflow: hidden;
        font-family: "Archivo", sans-serif;
        background: #e9e6df;
      }

        background: #15171a;

        border-radius: 30px;
        box-shadow:

          0 0 0 3px rgb(0 0 0 / 0.6),
          0 48px 100px -40px rgb(0 0 0 / 0.65),
          0 6px 18px -3px rgb(0 0 0 / 0.3);

      #end-mark {

        font-size: 176px;

        letter-spacing: 0.01em;

      .end-l {

        top: 812px;
        width: 417px;
        height: 132px;

    </style>
  </head>

    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        const END = 51; // the end card's start
        // the end card: the sign is stamped down, the wordmark laid a letter at a time, then
        // the question, the address and the button, each in steps
        tl.fromTo(
          "#end-sign",
          { opacity: 0, scale: 1.05 },
          { opacity: 1, scale: 1, duration: 0.13, ease: "steps(3)" },
          END,
        );
        for (let i = 0; i < 10; i++)
          tl.fromTo(
            "#end-l" + (i + 1),
            { opacity: 0, y: -70 },
            { opacity: 1, y: 0, duration: 0.1, ease: "steps(3)" },
            END + 0.15 + i * 0.08 - 0.1,
          );
        tl.fromTo(
          "#end-line",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.13, ease: "steps(3)" },
          END + 1.05,
        );
        tl.fromTo(
          "#end-address",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.13, ease: "steps(3)" },
          END + 1.35,
        );
        tl.fromTo(
          "#end-fund",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.13, ease: "steps(3)" },
          END + 1.65,
        );
        window.__timelines["main"] = tl;
      })();
