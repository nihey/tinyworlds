<!doctype html>
<!--
  "Guess the building": a vertical short per city (1080 × 1920, 30 s), for its subreddit and the
  apps. The picture is one take of the live viewer playing its own game (scripts/social/quiz-take.ts):
  three rounds, then the map alone. This file adds only the clip's own words: the hook, a 3-2-1 per
  round, the end card. Its moments are SCHEDULE in scripts/social/quiz-worlds.ts (120 BPM, a round
  is four bars), and one row per city of the render's batch sets the variables
  (scripts/social/quiz-render.ts). Every word sits between 168 and 1330 px: the apps cover the rest.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"take","type":"string","label":"The take","default":"assets/takes/tinyphl.mp4"},
    {"id":"mark","type":"string","label":"Wordmark, after tiny","default":"phl"},
    {"id":"accent","type":"color","label":"The world&apos;s colour","default":"#5b7cfa"},
    {"id":"hook1","type":"string","label":"Hook, first line","default":"Can you name"},
    {"id":"hook2","type":"string","label":"Hook, second line","default":"this building?"},
    {"id":"round1","type":"string","label":"Round 1","default":"Round 1 of 3"},
    {"id":"round2","type":"string","label":"Round 2","default":"Round 2 of 3"},
    {"id":"round3","type":"string","label":"Round 3","default":"Round 3 of 3"},
    {"id":"end1","type":"string","label":"End, first line","default":"How many"},
    {"id":"end2","type":"string","label":"End, second line","default":"did you get?"},
    {"id":"comments","type":"string","label":"Invitation to comment","default":"Tell us in the comments"},
    {"id":"play","type":"string","label":"Before the address","default":"Play the whole game at"},
    {"id":"address","type":"string","label":"The world&apos;s address","default":"example.com/tinyphl/"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tiny Worlds · Guess the building</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: Archivo;
        src: url("assets/fonts/archivo.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: Tiny5;
        src: url("assets/fonts/tiny5-latin.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #e9e6df;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #e9e6df;
        font-family: Archivo, sans-serif;
        color: #f4f2ec;
        --enamel: #15171a;
        --paper: #f4f2ec;
        --paper-dim: #a4a6a1;
        --line: rgb(255 255 255 / 0.11);
      }
      #take {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
      }
      /* the site's black enamel sign */
      .enamel {
        position: absolute;
        background: var(--enamel);
        color: var(--paper);
        border-radius: 20px;
        box-shadow:
          inset 0 2px 0 rgb(255 255 255 / 0.08),
          0 0 0 2px rgb(0 0 0 / 0.6),
          0 32px 68px -28px rgb(0 0 0 / 0.65),
          0 4px 12px -2px rgb(0 0 0 / 0.3);
        overflow: hidden;
      }
      .enamel::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 6px;
        background: var(--accent);
      }
      .mark {
        font-family: Tiny5, monospace;
        font-size: 44px;
        line-height: 1;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .mark .city {
        color: var(--accent);
      }

      /* each round's sign, top left: the wordmark, then the hook or the countdown */
      .round {
        left: 36px;
        top: 184px;
        width: 380px;
        height: 262px;
        z-index: 5;
      }
      .round .head {
        position: absolute;
        left: 28px;
        right: 26px;
        top: 30px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .round .rule {
        position: absolute;
        left: 0;
        right: 0;
        top: 96px;
        height: 2px;
        background: var(--line);
      }
      .hook {
        position: absolute;
        left: 28px;
        right: 20px;
        top: 114px;
        font-size: 47px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .hook .second {
        color: var(--accent);
      }
      .label {
        position: absolute;
        left: 28px;
        top: 122px;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--paper-dim);
        width: 150px;
      }
      .digit {
        position: absolute;
        right: 36px;
        top: 104px;
        width: 130px;
        text-align: center;
        font-family: Tiny5, monospace;
        font-size: 132px;
        line-height: 1;
        color: var(--accent);
      }
      .digit.armed {
        color: rgb(244 242 236 / 0.42);
      }
      /* the time left: twelve blocks, one goes out every quarter second */
      .blocks {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 26px;
        height: 14px;
        display: flex;
        gap: 6px;
      }
      .blocks i {
        flex: 1;
        background: var(--accent);
      }

      /* the end */

        left: 72px;
        top: 452px;
        width: 936px;
        height: 676px;
        z-index: 6;

      #end .mark {
        position: absolute;
        left: 56px;
        top: 66px;

        line-height: 1.02;
        font-weight: 800;

      #end-comments {

        left: 56px;
        top: 392px;
        font-size: 42px;
        line-height: 1.15;
        font-weight: 650;
        color: var(--paper);

        top: 482px;

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // a sign steps in and out as the site's do: pixels do not ease
      const stepIn = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.13, ease: "steps(3)" }, at);
      const stepOut = (sel, at) =>
        tl.fromTo(sel, { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.1, ease: "steps(2)" }, at);
      // round 1 is up from the first frame (it is the thumbnail); 2 and 3 step in after the flight starts
      stepOut("#sign-1", 4.88);
      stepIn("#sign-2", 8.2);
      stepOut("#sign-2", 12.88);
      stepIn("#sign-3", 16.2);
      stepOut("#sign-3", 20.88);
      // each digit lands with a small drop
      for (const [sel, at] of [
        ["#d1-3", 2],
        ["#d1-2", 3],
        ["#d1-1", 4],
        ["#d2-3", 10],
        ["#d2-2", 11],
        ["#d2-1", 12],
        ["#d3-3", 18],
        ["#d3-2", 19],
        ["#d3-1", 20],
      ]) {
        tl.fromTo(sel, { y: -18 }, { y: 0, duration: 0.1, ease: "steps(3)" }, at);
      }
      // the hook gives way to the countdown
      tl.fromTo("#label-1", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(2)" }, 2);
      // the time left, a block a quarter second, from the 3 to the pick
      for (const [r, from] of [
        [1, 2],
        [2, 10],
        [3, 18],
      ]) {
        for (let i = 0; i < 12; i++) {
          tl.set(`#b${r}-${11 - i}`, { opacity: 1 }, 0);
          tl.set(`#b${r}-${11 - i}`, { opacity: 0.16 }, from + 0.25 * (i + 1) - 0.001);
        }
      }
      // the end card
      stepIn("#end", 24.1);
      tl.fromTo(
        "#end-q",
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.13, ease: "steps(3)" },
        24.3,
      );
      tl.fromTo("#end-comments", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(2)" }, 24.9);
      tl.fromTo(
        ["#end-rule", "#end-play", "#end-address"],
        { opacity: 0 },
        { opacity: 1, duration: 0.1, ease: "steps(2)" },
        25.5,
      );
      window.__timelines["quiz"] = tl;
    </script>
  </body>
