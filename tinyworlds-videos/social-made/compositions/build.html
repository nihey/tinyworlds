  <script>
    const tl = gsap.timeline({ paused: true });

    // the camera: every plate alike, in octaves from WIDE to CLOSE (map px, CSS px per map px)
    const X0 = -618;
    const Y0 = -885;
    const WIDE = { x: 1302, y: 195, s: 0.5 };
    const CLOSE = { x: 1500, y: -40, s: 1 };
    const cams = document.querySelectorAll(".build-cam");
    const place = (u) => {
      const s = Math.exp(Math.log(WIDE.s) + (Math.log(CLOSE.s) - Math.log(WIDE.s)) * u);
      const k = (1 / s - 1 / WIDE.s) / (1 / CLOSE.s - 1 / WIDE.s);
      const x = WIDE.x + (CLOSE.x - WIDE.x) * k;
      const y = WIDE.y + (CLOSE.y - WIDE.y) * k;
      const transform = `translate(${960 - (x - X0) * s}px, ${540 - (y - Y0) * s}px) scale(${s})`;
      cams.forEach((cam) => (cam.style.transform = transform));
    };
    // the push lingers wide while the ground is laid (the whole Point in frame), then closes in on
    // downtown for the buildings: u = (1 - cos(π x²)) / 2 over the push's time x, still at both ends
    const camera = { x: 0 };
    const push = () => place((1 - Math.cos(Math.PI * camera.x * camera.x)) / 2);
    place(0);
    tl.fromTo(camera, { x: 0 }, { x: 1, duration: 18.6, ease: "none", onUpdate: push }, 0);

    // a layer comes in behind the bar, left to right, at a constant speed: mid-frame on the beat
    const scan = (n, at) => {
      tl.fromTo(
        `#l${n}-wipe`,
        { clipPath: "inset(0px 1920px 0px 0px)" },
        { clipPath: "inset(0px 0px 0px 0px)", duration: 0.4, ease: "none" },
        at,
      );
      tl.fromTo(`#scan${n}-bar`, { x: -18 }, { x: 1920, duration: 0.4, ease: "none" }, at);
    };
    scan(2, 4.6333);
    scan(3, 7.0333);
    scan(4, 9.4333);
    scan(6, 14.2333);
    scan(7, 16.6333);

    // signs arrive and leave the way pixels do: in steps, never eased
    const signIn = (id, at) =>
      tl.fromTo(id, { y: 42, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "steps(3)" }, at);
    const signOut = (id, at) =>
      tl.fromTo(
        id,
        { y: 0, opacity: 1 },
        { y: -28, opacity: 0, duration: 0.1667, ease: "steps(3)", immediateRender: false },
        at,
      );

    // the title is up on frame 0 (the thumbnail) and leaves before the first layer
    signOut("#hook-sign", 2.2333);
    signIn("#step1-sign", 2.4333);
    signOut("#step1-sign", 4.6333);
    signIn("#step2-sign", 4.8333);
    signOut("#step2-sign", 7.0333);
    signIn("#step3-sign", 7.2333);
    signOut("#step3-sign", 9.4333);
    signIn("#step4-sign", 9.6333);
    signOut("#step4-sign", 11.8333);
    signIn("#step5-sign", 12.0333);
    signOut("#step5-sign", 14.2333);
    signIn("#step6-sign", 14.4333);
    signOut("#step6-sign", 16.6333);
    signIn("#step7-sign", 16.8333);
    signOut("#step7-sign", 19.0333);

    window.__timelines["build"] = tl;
  </script>
</template>
