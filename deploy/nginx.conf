# The front page at /, and one static site per world under its own path: /tinynyc/, /tinyrao/, ...
# (/api/ never reaches this server: the reverse proxy in front routes it to the API.)
# Meant to be mounted into a stock nginx container as /etc/nginx/conf.d/default.conf, with the
# site directory at /usr/share/nginx/html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;
  gzip_min_length 1024;


  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # the manifest names the build: always revalidate it
  location ~ ^/[a-z0-9]+/data/manifest\.json$ {
    add_header Cache-Control "no-cache";
  }

  # tiles and indexes carry ?v=<build>, so they can be cached for good
  location ~ ^/[a-z0-9]+/data/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # the front page's own assets, then each world's
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/[a-z0-9]+/_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # a city's hall of fame is a page built for every city the API listed when the front page
  # was built; a city named since has none yet, and is shown by the hall of fame itself
  location ~ ^/hall-of-fame/(?<hall_city>[a-z0-9-]+)/?$ {
    add_header Cache-Control "no-cache";
    try_files $uri/index.html @hall_city;
  }

  location @hall_city {
    return 302 /hall-of-fame/?city=$hall_city;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
}
